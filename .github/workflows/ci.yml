name: CI Docker Build and Push

on:
  push:
    branches: [ "devolp" ]
  pull_request:
    branches: [ "devolp" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test File
        run: |
          touch generated-by-action.txt
          echo "Created at $(date)" > generated-by-action.txt
          ls -la

      - name: Verify Docker Installation
        run: docker --version

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ahmedsalahelsayed/testdepi:devolp

      - name: Test Run Docker Container
        run: |
          docker run --rm ahmedsalahelsayed/testdepi:devolp
