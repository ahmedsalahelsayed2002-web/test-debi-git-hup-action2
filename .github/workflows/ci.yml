name: CI Workflow

on:
  push:
    branches: [ "devolp" ]
  pull_request:
    branches: [ "devolp" ]
  workflow_dispatch:

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test File
        run: |
          touch generated-by-action.txt
          echo "Created at $(date)" > generated-by-action.txt
          ls -la

      - name: Verify Docker Installation
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build -t my-custom-app:v1 .

      - name: Test Run Docker Container
        run: |
          docker run --rm my-custom-app:v1

      - name: Docker Login and Push
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker tag my-custom-app:v1 ${{ secrets.DOCKER_USERNAME }}/testdepi:devolp
          docker push ${{ secrets.DOCKER_USERNAME }}/testdepi:devolp
