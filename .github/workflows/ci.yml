name: CI Workflow

on:
  push:
    branches: [ "devolp" ]
  pull_request:
    branches: [ "devolp" ]
  workflow_dispatch:

jobs:
  build-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create Test File
        run: |
          touch generated-by-action.txt
          echo "Created at $(date)" > generated-by-action.txt
          ls -la

      - name: Verify Docker Installation
        run: docker --version

      - name: Build Docker Image
        run: |
          docker build -t my-custom-app:v1 .

      - name: Test Run Docker Container
        run: |
          docker run --rm my-custom-app:v1

      - name: Docker Login and Push
        run: |
          sudo docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
          sudo docker tag ${{ environment.DOCKER_REGISTRY }}/my-nginx-image:v1.$GITHUB_RUN_NUMBER ${{ environment.DOCKER_REGISTRY }}/my-nginx-image:latest
          sudo docker push ${{ environment.DOCKER_REGISTRY }}/my-nginx-image:latest
